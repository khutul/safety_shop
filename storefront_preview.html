<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Safety Shop — Preview</title>
<style>
  :root{ --brand:#7A1F2B; --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f7f8; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:10}
  header .logo{font-weight:800;font-size:20px;letter-spacing:.5px}
  header input{flex:1;max-width:520px;padding:9px 12px;border:0;border-radius:6px;font-size:14px}
  header .lang{margin-left:auto;display:flex;gap:6px}
  header .lang button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:6px 10px;border-radius:5px;cursor:pointer}
  header .lang button.active{background:#fff;color:var(--brand);font-weight:700}
  .wrap{display:flex;gap:20px;max-width:1280px;margin:20px auto;padding:0 16px}
  aside{width:250px;flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;height:fit-content}
  aside h3{margin:8px 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  aside a{display:flex;justify-content:space-between;padding:9px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer}
  aside a:hover{background:var(--bg)}
  aside a.active{background:var(--brand);color:#fff}
  main{flex:1;min-width:0}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .toolbar h2{margin:0;font-size:18px}
  .toolbar .count{color:var(--muted);font-size:13px}
  .toolbar select{margin-left:auto;padding:7px 10px;border:1px solid var(--line);border-radius:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
  .card .imgbox{aspect-ratio:1;background:#f0f1f3;display:flex;align-items:center;justify-content:center;color:#c3c7cd;font-size:12px}
  .card img{width:100%;height:100%;object-fit:cover}
  .card .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card .brand{font-size:11px;color:var(--brand);font-weight:700;text-transform:uppercase}
  .card .name{font-size:13px;line-height:1.35;min-height:36px}
  .card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
  .card .price{font-weight:800;font-size:15px}
  .badge{font-size:11px;padding:3px 7px;border-radius:20px}
  .badge.in{background:#e6f4ea;color:#137333}
  .badge.low{background:#fef7e0;color:#a56300}
  .badge.out{background:#fce8e6;color:#c5221f}
  .empty{padding:60px;text-align:center;color:var(--muted)}
  footer{max-width:1280px;margin:20px auto;padding:16px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <span class="logo">🛡 SAFETY SHOP</span>
  <input id="search" placeholder="Бараа хайх… / Search…"/>
  <div class="lang">
    <button data-lang="mn" class="active">MN</button>
    <button data-lang="en">EN</button>
  </div>
</header>

<div class="wrap">
  <aside>
    <h3 id="cat-title">Ангилал</h3>
    <div id="cats"></div>
  </aside>
  <main>
    <div class="toolbar">
      <h2 id="cat-name">Бүх бараа</h2>
      <span class="count" id="count"></span>
      <select id="sort">
        <option value="">Эрэмбэ</option>
        <option value="price_asc">Үнэ ↑</option>
        <option value="price_desc">Үнэ ↓</option>
        <option value="newest">Шинэ</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Бараа олдсонгүй</div>
  </main>
</div>
<footer>Safety Shop preview · Odoo API (localhost:8079/api/v1) · demo</footer>

<script>
const API = "http://localhost:8079/api/v1";
let state = { lang:"mn", category:"", q:"", sort:"" };

const T = {
  mn:{cats:"Ангилал", all:"Бүх бараа", none:"Бараа олдсонгүй", in:"Байгаа", low:"Бага", out:"Дууссан"},
  en:{cats:"Categories", all:"All products", none:"No products found", in:"In stock", low:"Low", out:"Out"},
};
const fmt = n => new Intl.NumberFormat("mn-MN").format(n) + "₮";

async function loadCategories(){
  const res = await fetch(`${API}/categories?lang=${state.lang}`);
  const cats = await res.json();
  const el = document.getElementById("cats");
  const t = T[state.lang];
  document.getElementById("cat-title").textContent = t.cats;
  let html = `<a data-slug="" class="${state.category===''?'active':''}">${t.all}</a>`;
  cats.forEach(c => {
    html += `<a data-slug="${c.slug}" class="${state.category===c.slug?'active':''}">${c.name}</a>`;
  });
  el.innerHTML = html;
  el.querySelectorAll("a").forEach(a => a.onclick = () => {
    state.category = a.dataset.slug;
    document.getElementById("cat-name").textContent = a.textContent;
    loadProducts();
    el.querySelectorAll("a").forEach(x=>x.classList.remove("active"));
    a.classList.add("active");
  });
}

async function loadProducts(){
  const p = new URLSearchParams({lang:state.lang, limit:"48"});
  if(state.category) p.set("category", state.category);
  if(state.q) p.set("q", state.q);
  if(state.sort) p.set("sort", state.sort);
  const res = await fetch(`${API}/products?${p}`);
  const data = await res.json();
  const grid = document.getElementById("grid");
  const t = T[state.lang];
  document.getElementById("count").textContent = `${data.count} бараа`;
  document.getElementById("empty").style.display = data.products.length? "none":"block";
  document.getElementById("empty").textContent = t.none;
  grid.innerHTML = data.products.map(pr => `
    <div class="card">
      <div class="imgbox">${pr.main_image_url ? `<img src="http://localhost:8079${pr.main_image_url}"/>` : "зураг алга"}</div>
      <div class="body">
        <div class="brand">${pr.brand? pr.brand.name : "&nbsp;"}</div>
        <div class="name">${pr.name}</div>
        <div class="foot">
          <span class="price">${fmt(pr.price)}</span>
          <span class="badge ${pr.stock_status}">${t[pr.stock_status]}</span>
        </div>
      </div>
    </div>`).join("");
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  state.lang = b.dataset.lang;
  document.querySelectorAll(".lang button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  loadCategories(); loadProducts();
});
let deb; document.getElementById("search").oninput = e => {
  clearTimeout(deb); deb = setTimeout(()=>{ state.q = e.target.value; loadProducts(); }, 350);
};
document.getElementById("sort").onchange = e => { state.sort = e.target.value; loadProducts(); };

loadCategories(); loadProducts();
</script>
</body>
</html>
