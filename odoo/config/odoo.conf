[options]
; ============================================================
; safety_shop  —  Odoo 19 Community (development)
; Completely isolated from the existing "bodons_erp" project.
; ============================================================

; --- Master / admin password (used to create/manage databases) ---
admin_passwd = safety_shop_master_2026

; --- Database connection (points to the "db" service in compose) ---
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Only show / allow databases that belong to THIS project.
; This is what keeps safety_shop and bodons_erp from ever mixing.
dbfilter = ^safety_shop.*$
list_db = True

; --- Addons ---
; Custom addons mounted from ./addons (empty for now — no custom modules yet).
; Standard Odoo addons live inside the image at /usr/lib/python3/dist-packages/odoo/addons.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; --- Data / filestore ---
data_dir = /var/lib/odoo

; --- Networking / ports (inside the container) ---
; HTTP (mapped to host 8079) and websocket/longpolling (mapped to host 8089).
http_port = 8069
gevent_port = 8072
proxy_mode = False

; --- Developer-friendly settings ---
; 0 workers = single-process, easiest for development and debugging.
workers = 0
max_cron_threads = 1

; Verbose-ish but readable logging.
log_level = info
log_handler = :INFO

; Don't auto-load demo data unless you ask for it at db-create time.
without_demo = all
