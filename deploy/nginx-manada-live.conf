# /etc/nginx/sites-available/manada-live.conf
# manada.mn амьд домайн — HTTP (80). certbot дараа нь 443-ыг өөрөө нэмнэ.
# Бусад сайтад нөлөөлөхгүй: nginx server_name-ээр ялгаж чиглүүлдэг.

server {
    listen 80;
    listen [::]:80;
    server_name manada.mn www.manada.mn;

    client_max_body_size 64m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Odoo REST API + бүтээгдэхүүний зураг
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8079;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Odoo backend UI — зөвхөн оффисын IP-ээс (доорх мөрийг өөрийн IP-ээр идэвхжүүлнэ)
    location /odoo {
        # allow 103.50.206.188;   # оффисын гадаад IP-ээ бичнэ
        # deny all;
        proxy_pass http://127.0.0.1:8079;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /web {
        proxy_pass http://127.0.0.1:8079;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /websocket {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Бусад бүх зам -> Next.js storefront
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
