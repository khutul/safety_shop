# /etc/nginx/sites-available/manada.conf
# Reverse proxy: storefront (Next.js) + Odoo API.
# HTTPS is added automatically by certbot after:
#   sudo certbot --nginx -d manada.mn -d www.manada.mn
# (test server: use the test domain instead)

server {
    listen 80;
    server_name manada.mn www.manada.mn;

    client_max_body_size 32m;

    # Odoo REST API + images (served through the storefront domain)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8079;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Odoo backend UI — админ хэсэг. Зөвхөн оффисын IP-ээс нэвтэрдэг
    # болгохыг зөвлөж байна (allow <office-ip>; deny all;)
    location /odoo {
        # allow 202.x.x.x;   # оффисын гадаад IP
        # deny all;
        proxy_pass http://127.0.0.1:8079;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /web {
        proxy_pass http://127.0.0.1:8079;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /websocket {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else -> Next.js storefront
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
